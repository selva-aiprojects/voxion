services:
  # Voxion Assistant Engine (API & WebSockets)
  - type: web
    name: voxion-backend
    runtime: node
    buildCommand: npm install && npm run build --workspace=apps/backend
    startCommand: node apps/backend/dist/main
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3001
      - key: OPENAI_API_KEY
        sync: false # Set this manually in Render dashboard
      - key: ENCRYPTION_KEY
        sync: false # Set this manually in Render dashboard
      - key: DATABASE_URL
        sync: false # Set this manually in Render dashboard
    healthCheckPath: /
    rootContext: .
